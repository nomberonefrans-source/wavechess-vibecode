name: build
on:
  push:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - "src/**"
      - "Cargo.*"
      - "tests/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/release/wavechess.exe
          - os: ubuntu-latest
            binary: target/release/wavechess
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --release
      - run: cargo build --release
      - run: cargo run --release -- selftest
      - run: python tests/uci_protocol.py ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: wavechess-3.0-${{ matrix.os }}
          path: |
            ${{ matrix.binary }}
            README.md
            CHANGES_RU.md
          if-no-files-found: error
